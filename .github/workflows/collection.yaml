on:
  release:
    types:
      - published
    tags:
      - 'v*'

jobs:
  deploy:
    uses: adfinis/github-workflows-bareos/.github/workflows/ansible-collection.yaml@a8202adab97bea9b476bf32da11a835cf216d8b9 # v0.11.1
    secrets:
      galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
