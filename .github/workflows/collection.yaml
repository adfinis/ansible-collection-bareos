---
name: Build and deploy Collection on Ansible Galaxy
on:
  release:
    types:
      - published
    tags:
      - 'v*'

jobs:
  deploy:
    uses: adfinis/github-workflows-bareos/.github/workflows/ansible-collection.yaml@1c3254f70abac8c7aa282dfd1498f6d387921463 # v0.11.2
    secrets:
      galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
