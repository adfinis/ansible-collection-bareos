---
name: Build and deploy Collection on Ansible Galaxy
on:
  release:
    types:
      - published
    tags:
      - 'v*'

jobs:
  deploy:
    uses: adfinis/github-workflows-bareos/.github/workflows/ansible-collection.yaml@eedff15b52be3c117bd5f7a28492494596399311 # v0.8.0
    secrets:
      galaxy_api_key: ${{ secrets.GALAXY_API_KEY }}
