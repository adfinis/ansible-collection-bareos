---
# runs on each push to main and is responsible for creating new tags/releases
name: Create Semantic Release

on:
  push:
    branches:
      - main

jobs:
  semantic-release:
    uses: adfinis/github-workflows-bareos/.github/workflows/semantic-release.yaml@a8202adab97bea9b476bf32da11a835cf216d8b9 # v0.11.1
    secrets:
      ADFINIS_RELEASES_GITHUB_CLIENT_ID: ${{ secrets.ADFINIS_RELEASES_GITHUB_CLIENT_ID }}
      ADFINIS_RELEASES_GITHUB_APP_PRIVATE_KEY: ${{ secrets.ADFINIS_RELEASES_GITHUB_APP_PRIVATE_KEY }}
